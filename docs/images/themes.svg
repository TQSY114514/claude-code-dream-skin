    <!-- Row 5 -->
    <g transform="translate(24,472)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#c8a55a"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Gothic Void Crusade</text>
      <text x="20" y="58" font-size="11" fill="#a1a1aa">暗金哥特风</text>
      <circle cx="180" cy="78" r="7" fill="#c8a55a"/>
    </g>
  </g>

  <text x="24" y="528" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="11" fill="#71717a" text-rendering="geometricPrecision">
    17 款预设主题 · 每款由 accent 色 + 背景色 + CSS 变量系统驱动
  </text>
