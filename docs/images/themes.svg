    <!-- Row 3 -->
    <g transform="translate(24,248)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#4FC3F7"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Ocean Deep</text>
      <text x="20" y="58" font-size="11" fill="#a1a1aa">深海蓝珊瑚色</text>
      <circle cx="180" cy="78" r="7" fill="#4FC3F7"/>
    </g>
    <g transform="translate(240,248)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#cba6f7"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Catppuccin Mocha</text>
      <text x="20" y="58" font-size="11" fill="#a1a1aa">温暖奶昔柔彩</text>
      <circle cx="180" cy="78" r="7" fill="#cba6f7"/>
    </g>
    <g transform="translate(456,248)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#BD93F9"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Dracula</text>
      <text x="20" y="58" font-size="11" fill="#a1a1aa">官方 Dracula 紫粉</text>
