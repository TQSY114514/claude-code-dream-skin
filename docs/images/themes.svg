    <g transform="translate(240,360)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#FCEE0A"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Cyberpunk</text>
      <text x="20" y="58" font-size="11" fill="#a1a1aa">霓虹黄青洋红纯黑</text>
      <circle cx="180" cy="78" r="7" fill="#FCEE0A"/>
