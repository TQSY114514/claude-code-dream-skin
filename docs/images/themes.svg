    <g transform="translate(672,360)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#ff45c8"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Pixel Cafe</text>
