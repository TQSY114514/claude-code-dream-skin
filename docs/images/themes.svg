    <g transform="translate(672,136)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#ff7e5f"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Sunset Boulevard</text>
      <text x="20" y="58" font-size="11" fill="#a1a1aa">温暖紫橙渐变</text>
      <circle cx="180" cy="78" r="7" fill="#ff7e5f"/>
