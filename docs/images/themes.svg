<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" role="img" aria-label="预设主题色板">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1f"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
  </defs>
  <rect width="880" height="540" fill="#0d0d0f"/>

  <!-- 4 columns x 5 rows, cell 200x96, gap 16, origin 24,24 -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-rendering="geometricPrecision">

    <!-- Row 1 -->
    <g transform="translate(24,24)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#FF6B35"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Default</text>
      <text x="20" y="58" font-size="11" fill="#a1a1aa">Claude 标志性橙</text>
      <circle cx="180" cy="78" r="7" fill="#FF6B35"/>
    </g>
    <g transform="translate(240,24)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#7ec8e3"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Gothic Neon</text>
      <text x="20" y="58" font-size="11" fill="#a1a1aa">暗色紫青赛博朋克</text>
      <circle cx="180" cy="78" r="7" fill="#7ec8e3"/>
    </g>
    <g transform="translate(456,24)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#7dcfff"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Tokyo Night</text>
      <text x="20" y="58" font-size="11" fill="#a1a1aa">东京夜景风格</text>
      <circle cx="180" cy="78" r="7" fill="#7dcfff"/>
    </g>
    <g transform="translate(672,24)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#8fc9a0"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Forest Mist</text>
      <text x="20" y="58" font-size="11" fill="#a1a1aa">自然绿色调</text>
      <circle cx="180" cy="78" r="7" fill="#8fc9a0"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(24,136)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#e8a0c0"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Sakura Dream</text>
      <text x="20" y="58" font-size="11" fill="#a1a1aa">樱花粉紫浪漫</text>
      <circle cx="180" cy="78" r="7" fill="#e8a0c0"/>
    </g>
    <g transform="translate(240,136)">
      <rect width="200" height="96" rx="10" fill="url(#cardbg)"/>
      <rect width="6" height="96" rx="3" fill="#22d3ee"/>
      <text x="20" y="38" font-size="14" font-weight="600" fill="#f4f4f5">Midnight Glass</text>
      <text x="20" y="58" font-size="11" fill="#a1a1aa">玻璃拟态深蓝</text>
      <circle cx="180" cy="78" r="7" fill="#22d3ee"/>
